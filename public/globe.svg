<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globe-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#globe-gradient)" stroke-width="2"/>
  <path d="M40,200 A160,160 0 1,1 360,200" fill="none" stroke="url(#globe-gradient)" stroke-width="2">
    <animateTransform 
      attributeName="transform"
      type="rotate"
      from="0 200 200"
      to="360 200 200"
      dur="8s"
      repeatCount="indefinite"
    />
  </path>
  <path d="M40,200 A160,160 0 1,0 360,200" fill="none" stroke="url(#globe-gradient)" stroke-width="2">
    <animateTransform 
      attributeName="transform"
      type="rotate"
      from="0 200 200"
      to="360 200 200"
      dur="6s"
      repeatCount="indefinite"
    />
  </path>
</svg>